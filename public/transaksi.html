<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaksi - Ladang Usaha</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo.png" alt="Ladang Usaha" class="sidebar-logo">
      <span style="font-weight: 700; font-size: 1.125rem;">Ladang Usaha</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/transaksi.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Transaksi
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="sidebar-link logout-btn" style="color: var(--danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </a>
    </div>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="hamburger">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h2 style="font-size: 1.25rem; font-weight: 600;">Transaksi</h2>
      </div>
    </header>
    
    <div class="page-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <div>
            <label class="label">Cari Transaksi</label>
            <input type="text" id="searchTransaction" class="input" placeholder="No. transaksi...">
          </div>
          <div>
            <label class="label">Tanggal Mulai</label>
            <input type="date" id="startDate" class="input">
          </div>
          <div>
            <label class="label">Tanggal Akhir</label>
            <input type="date" id="endDate" class="input">
          </div>
          <div>
            <label class="label">Metode Pembayaran</label>
            <select id="filterPayment" class="select">
              <option value="">Semua</option>
              <option value="cash">Tunai</option>
              <option value="debit">Debit</option>
              <option value="credit">Kredit</option>
              <option value="qris">QRIS</option>
              <option value="transfer">Transfer</option>
            </select>
          </div>
          <div style="display: flex; align-items: flex-end;">
            <button class="btn btn-primary" id="applyFilter" style="width: 100%;">Terapkan Filter</button>
          </div>
        </div>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Transaksi</th>
              <th>Kasir</th>
              <th>Total</th>
              <th>Pembayaran</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionsTableBody"></tbody>
        </table>
      </div>
      
      <div id="transactionPagination" style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.5rem;"></div>
    </div>
  </div>

  <nav class="mobile-nav">
    <div class="mobile-nav-links">
      <a href="/dashboard.html" class="mobile-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/transaksi.html" class="mobile-nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Transaksi
      </a>
    </div>
  </nav>

  <script src="/js/app.js"></script>
  <script src="/js/transaksi.js"></script>
</body>
</html>
