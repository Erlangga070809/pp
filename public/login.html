<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ladang Usaha</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="/assets/logo.png" alt="Ladang Usaha" class="login-logo">
      <h1 class="login-title">Selamat Datang</h1>
      <p class="login-subtitle">Masuk ke akun Ladang Usaha Anda</p>
      
      <div id="loginError" style="display: none; background-color: var(--danger-light); color: #991B1B; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.875rem;"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="label" for="email">Email</label>
          <input type="email" id="email" class="input" placeholder="nama@email.com" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label class="label" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="input" placeholder="Masukkan password" required autocomplete="current-password">
            <button type="button" id="showPassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 0.25rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Masuk</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted);">
        Belum punya akun? <a href="#" id="showRegister">Daftar sekarang</a>
      </p>
    </div>
    
    <div id="registerCard" class="login-card" style="display: none;">
      <img src="/assets/logo.png" alt="Ladang Usaha" class="login-logo">
      <h1 class="login-title">Daftar</h1>
      <p class="login-subtitle">Buat akun Ladang Usaha baru</p>
      
      <div id="registerError" style="display: none; background-color: var(--danger-light); color: #991B1B; padding: 0.75rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.875rem;"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label class="label" for="regName">Nama Lengkap</label>
          <input type="text" id="regName" class="input" placeholder="Nama Anda" required>
        </div>
        
        <div class="form-group">
          <label class="label" for="regBusinessName">Nama Usaha</label>
          <input type="text" id="regBusinessName" class="input" placeholder="Nama usaha Anda" required>
        </div>
        
        <div class="form-group">
          <label class="label" for="regEmail">Email</label>
          <input type="email" id="regEmail" class="input" placeholder="nama@email.com" required>
        </div>
        
        <div class="form-group">
          <label class="label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="input" placeholder="Minimal 8 karakter" required minlength="8">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Daftar</button>
      </form>
      
      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--muted);">
        Sudah punya akun? <a href="#" id="showLogin">Masuk</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
  const showRegister = document.getElementById('showRegister');
  const showLogin = document.getElementById('showLogin');
  const loginCard = document.querySelector('.login-card');
  const registerCard = document.getElementById('registerCard');
  
  if (showRegister) {
    showRegister.addEventListener('click', (e) => {
      e.preventDefault();
      loginCard.style.display = 'none';
      registerCard.style.display = 'block';
    });
  }
  
  if (showLogin) {
    showLogin.addEventListener('click', (e) => {
      e.preventDefault();
      registerCard.style.display = 'none';
      loginCard.style.display = 'block';
    });
  }
  
  if (window.location.hash === '#register') {
    loginCard.style.display = 'none';
    registerCard.style.display = 'block';
  }
  
  const registerForm = document.getElementById('registerForm');
  if (registerForm) {
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('regName').value;
      const business_name = document.getElementById('regBusinessName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const submitBtn = registerForm.querySelector('button[type="submit"]');
      const errorDiv = document.getElementById('registerError');
      
      if (!name || !business_name || !email || !password) {
        errorDiv.textContent = 'Semua field harus diisi';
        errorDiv.style.display = 'block';
        return;
      }
      
      if (password.length < 8) {
        errorDiv.textContent = 'Password minimal 8 karakter';
        errorDiv.style.display = 'block';
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';
      errorDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ name, email, password, business_name })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.message || 'Pendaftaran gagal';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'Terjadi kesalahan. Silakan coba lagi.';
        errorDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daftar';
      }
    });
  }
</script>
</body>
</html>
