<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produk - Ladang Usaha</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo.png" alt="Ladang Usaha" class="sidebar-logo">
      <span style="font-weight: 700; font-size: 1.125rem;">Ladang Usaha</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/produk.html" class="sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Produk
      </a>
      <a href="/transaksi.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Transaksi
      </a>
      <a href="/laporan.html" class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Laporan
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="sidebar-link logout-btn" style="color: var(--danger);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </a>
    </div>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="hamburger">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h2 style="font-size: 1.25rem; font-weight: 600;">Produk</h2>
      </div>
      <button class="btn btn-primary" id="addProductBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambah Produk
      </button>
    </header>
    
    <div class="page-content">
      <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem;">
          <div>
            <label class="label">Cari Produk</label>
            <input type="text" id="searchProduct" class="input" placeholder="Nama atau SKU...">
          </div>
          <div>
            <label class="label">Kategori</label>
            <select id="filterCategory" class="select">
              <option value="">Semua Kategori</option>
            </select>
          </div>
          <div>
            <label class="label">Status</label>
            <select id="filterStatus" class="select">
              <option value="">Semua</option>
              <option value="active">Aktif</option>
              <option value="inactive">Nonaktif</option>
            </select>
          </div>
          <div>
            <label class="label">Urutkan</label>
            <select id="sortBy" class="select">
              <option value="created_at">Terbaru</option>
              <option value="name">Nama</option>
              <option value="sku">SKU</option>
              <option value="stock">Stok</option>
              <option value="selling_price">Harga</option>
            </select>
          </div>
          <div>
            <label class="label">Urutan</label>
            <select id="sortOrder" class="select">
              <option value="desc">Menurun</option>
              <option value="asc">Menaik</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Produk</th>
              <th>Kategori</th>
              <th>Harga Jual</th>
              <th>Harga Beli</th>
              <th>Stok</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
      
      <div id="pagination" style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.5rem;"></div>
    </div>
  </div>

  <select id="productCategory" style="display: none;"></select>

  <nav class="mobile-nav">
    <div class="mobile-nav-links">
      <a href="/dashboard.html" class="mobile-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/produk.html" class="mobile-nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Produk
      </a>
      <a href="/kasir.html" class="mobile-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Kasir
      </a>
    </div>
  </nav>

  <script src="/js/app.js"></script>
  <script src="/js/produk.js"></script>
</body>
</html>
